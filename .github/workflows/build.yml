# Builds Bulklogger for Windows and macOS, and optionally publishes a release.
#
# PyInstaller cannot cross-compile, so each binary is built on its own runner.
# This is how to get a macOS build without owning a Mac.
#
# MANUAL ONLY. Actions -> build -> Run workflow.
#   * leave the version box blank  -> just build, download the zips from the
#     run summary under "Artifacts"
#   * put a tag in it, e.g. v1.0.0 -> also publish a GitHub Release with both
#     zips attached (the tag is created for you at the current commit)
#
# Tests are not run here; run them locally with:
#   python -m unittest test_bulklogger test_app

name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.0. Leave blank to only build."
        required: false
        default: ""

permissions:
  contents: write # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt

      - name: Work out the version label
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="dev-${GITHUB_SHA::7}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build.sh
          ./build.sh

      # Only the executable comes out of dist/. tickets.toml and the credentials
      # example are repo files and are taken from the root, so packaging does
      # not depend on what the build script happened to leave in dist/.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "Bulklogger-${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item dist\Bulklogger.exe $stage
          Copy-Item tickets.toml, credentials.toml.example $stage
          # README is optional so a release still builds before one is written
          if (Test-Path README.md) { Copy-Item README.md $stage }
          Compress-Archive -Force -Path $stage -DestinationPath "$stage-windows.zip"

      # ditto, not zip: it preserves the bundle's symlinks and executable bits,
      # which a plain zip mangles and Gatekeeper then rejects outright.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          stage="Bulklogger-${{ steps.version.outputs.value }}"
          mkdir -p "$stage"
          cp -R dist/Bulklogger.app "$stage"/
          cp tickets.toml credentials.toml.example "$stage"/
          # README is optional so a release still builds before one is written
          if [ -f README.md ]; then cp README.md "$stage"/; fi
          ditto -c -k --sequesterRsrc --keepParent "$stage" "$stage-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Bulklogger-${{ matrix.name }}
          path: Bulklogger-*.zip
          if-no-files-found: error

  release:
    needs: build
    # only when the version box was filled in
    if: github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A quoted heredoc, so nothing in the notes needs shell escaping.
      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Install

          **Windows** — unzip and run `Bulklogger.exe`. Keep `tickets.toml` in the
          same folder.

          **macOS** — unzip, then **right-click → Open** `Bulklogger.app` the first
          time. The app is unsigned, so a plain double-click is blocked by
          Gatekeeper. Keep `tickets.toml` in the same folder as the app.

          On first run you are asked for your email and a Jira API token, created
          at id.atlassian.com → Security → API tokens. It is saved to
          `credentials.toml` next to the app.

          `credentials.toml` is personal to you — never share it or commit it. If
          it is ever exposed, revoke the token and use **Sign out** to enter a new
          one.

          Edit `tickets.toml` to list the goal tickets you log against.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version }}"
          ls -la artifacts
          gh release create "$TAG" artifacts/*.zip \
            --title "Bulklogger $TAG" \
            --notes-file notes.md
